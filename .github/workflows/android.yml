name: APK na Androida

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Potrzebne, żeby workflow mógł utworzyć wydanie z plikiem APK.
permissions:
  contents: write

jobs:
  apk:
    name: Zbuduj APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Akcja android-actions/setup-android instaluje pakiet „tools”, którego
      # Google już nie wystawia — kończy się to błędem „Failed to find package
      # 'tools'”. Obraz ubuntu-latest ma SDK preinstalowane, więc wystarczy
      # wskazać jego katalog i upewnić się, że jest platforma wymagana przez
      # Capacitora (compileSdk 34).
      - name: Przygotuj Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Nie znaleziono Android SDK w $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "--- zainstalowane platformy ---"
          ls "$SDK/platforms" 2>/dev/null || echo "(brak)"
          echo "--- build-tools ---"
          ls "$SDK/build-tools" 2>/dev/null || echo "(brak)"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Nie znaleziono sdkmanager — polegam na tym, co jest w obrazie."
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"

          # Licencje trzeba zaakceptować, inaczej Gradle odmówi pobrania braków.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Dociągamy tylko to, czego brakuje — zwykle nic.
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "Instaluję platformy;android-34"
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Zainstaluj zależności
        run: npm ci

      - name: Testy jednostkowe
        run: npm test

      - name: Test deduplikacji newsów
        run: npm run test:dedup

      # Ikony MUSZĄ powstać przed budowaniem – Vite kopiuje public/ do dist/
      # dopiero w trakcie budowania.
      - name: Wygeneruj ikony
        run: node scripts/generuj-ikony.mjs

      - name: Zbuduj wersję webową
        # Ta sama wartość co znacznik wydania niżej — aplikacja porównuje ją
        # z najnowszym wydaniem na GitHubie, żeby wykryć aktualizację.
        env:
          WERSJA_APLIKACJI: v1.0.${{ github.run_number }}
        run: npm run build

      - name: Dodaj platformę Android
        run: npx cap add android || echo "Platforma już istnieje"

      - name: Zsynchronizuj Capacitor
        run: npx cap sync android

      # Stały klucz z sekretów repozytorium. Bez niego build dostałby losowy
      # klucz debug i Android odmówiłby zainstalowania aktualizacji na
      # poprzednią wersję — dlatego brak sekretu przerywa build, zamiast
      # po cichu wypuścić plik, którego nie da się zaktualizować.
      - name: Przygotuj klucz podpisu
        env:
          KLUCZ_BASE64: ${{ secrets.KLUCZ_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KLUCZ_BASE64:-}" ]; then
            echo "::error::Brak sekretu KLUCZ_BASE64 – bez stałego klucza aktualizacje nie zadziałają."
            exit 1
          fi
          echo "$KLUCZ_BASE64" | base64 -d > "$RUNNER_TEMP/btc-sygnaly.jks"
          echo "KLUCZ_PLIK=$RUNNER_TEMP/btc-sygnaly.jks" >> "$GITHUB_ENV"
          echo "Klucz zapisany ($(stat -c %s "$RUNNER_TEMP/btc-sygnaly.jks") bajtów)."

      - name: Nałóż dostosowania (motyw, wersja, aktualizator, podpis)
        env:
          WERSJA_APLIKACJI: v1.0.${{ github.run_number }}
          NUMER_BUDOWANIA: ${{ github.run_number }}
        run: node scripts/dostosuj-android.mjs

      - name: Ikony Androida
        # Drugi przebieg – katalog android/ powstał dopiero teraz.
        run: node scripts/generuj-ikony.mjs

      - name: Gradle – assembleDebug
        working-directory: android
        env:
          KLUCZ_HASLO: ${{ secrets.KLUCZ_HASLO }}
          KLUCZ_ALIAS: ${{ secrets.KLUCZ_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Przygotuj plik do wydania
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/btc-sygnaly.apk
          ls -lh dist-apk/

      # Strażnik: jeśli kiedykolwiek build zostałby podpisany innym kluczem,
      # wydanie nie powstanie. Odcisk klucza nie jest tajny – to jego publiczna
      # część, taka sama w każdym zainstalowanym egzemplarzu aplikacji.
      - name: Sprawdź odcisk klucza podpisu
        env:
          OCZEKIWANY: 0C:E0:A4:12:20:0E:1A:28:47:E3:24:71:7C:37:EC:23:BC:6D:C0:14:59:55:D3:1C:A8:BC:9D:F8:65:F2:EC:01
        run: |
          set -euo pipefail
          ODCISK="$(keytool -printcert -jarfile dist-apk/btc-sygnaly.apk | grep -m1 'SHA256:' | awk '{print $2}')"
          echo "Odcisk APK:      $ODCISK"
          echo "Oczekiwany:      $OCZEKIWANY"
          if [ "$ODCISK" != "$OCZEKIWANY" ]; then
            echo "::error::APK podpisany innym kluczem – aktualizacja nie zainstalowałaby się na telefonach."
            exit 1
          fi
          echo "Podpis zgodny."

      - name: Wystaw APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: btc-sygnaly-apk
          path: dist-apk/btc-sygnaly.apk
          retention-days: 90

      # Wydanie daje publiczny, bezpośredni link do pobrania — w odróżnieniu
      # od artefaktu, który wymaga zalogowania na GitHubie.
      - name: Opublikuj wydanie
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"

          # Treść wydania piszemy do pliku — wielolinijkowy --notes wprost
          # w poleceniu wciągnąłby wcięcia z YAML-a i zepsuł formatowanie.
          cat > notatki.md <<'KONIEC'
          Aplikacja do analizy Bitcoina: sygnały long/short w dwóch horyzontach
          (krótki i długi), wykresy na żywo, newsy z deduplikacją. Wszystko po polsku.

          ## Android

          Pobierz **btc-sygnaly.apk** z listy poniżej i otwórz plik na telefonie.
          Przy pierwszej instalacji Android poprosi o zgodę na instalowanie
          z nieznanych źródeł — trzeba ją wydać dla przeglądarki lub menedżera plików.

          ## iPhone

          Otwórz stronę aplikacji w **Safari** i wybierz
          *Udostępnij → Dodaj do ekranu początkowego*.
          Aplikacja zadziała wtedy pełnoekranowo, z własną ikoną i trybem offline.

          ---

          To nie jest porada inwestycyjna. Handel BTC z dźwignią wiąże się
          z ryzykiem utraty całego kapitału.
          KONIEC

          # Link do pobrania wskazuje na NAJNOWSZE wydanie, więc plik IPA
          # z poprzedniego trzeba przenieść dalej — inaczej po każdym buildzie
          # Androida link dla iPhone'a zaczynałby zwracać 404. IPA powstaje
          # rzadziej (osobny, ręcznie uruchamiany workflow na macOS).
          PLIKI="dist-apk/btc-sygnaly.apk"
          POPRZEDNIE="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$POPRZEDNIE" ]; then
            if gh release download "$POPRZEDNIE" --pattern '*.ipa' --dir dist-apk 2>/dev/null; then
              echo "Przenoszę IPA z wydania $POPRZEDNIE"
              PLIKI="$PLIKI dist-apk/btc-sygnaly.ipa"
            else
              echo "Poprzednie wydanie nie miało pliku IPA — pomijam."
            fi
          fi

          # Ponowne uruchomienie tego samego przebiegu dałoby ten sam tag,
          # a wtedy "release create" kończy się błędem — sprzątamy najpierw.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Wydanie $TAG już istnieje — usuwam i tworzę na nowo."
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          # shellcheck disable=SC2086
          gh release create "$TAG" $PLIKI \
            --title "BTC Sygnały $TAG" \
            --notes-file notatki.md \
            --latest

          echo "Wydanie opublikowane: $TAG"
          echo "Android: https://github.com/${{ github.repository }}/releases/latest/download/btc-sygnaly.apk"
          echo "iPhone:  https://diketes.github.io/btc-sygnaly/"
